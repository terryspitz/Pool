<!doctype html>
<html>
<head>
  <title>Pool</title>
  <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
  body {
    overflow: hidden; /* Hide scrollbars */
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .icon-button {
    position: fixed;
    top: 12px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.45);
    color: white;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    z-index: 20;
  }
  .icon-button:hover {
    background: rgba(0, 0, 0, 0.65);
  }
  #play-toggle { right: 12px; }
  #fullscreen-toggle { right: 60px; }
  #settings-toggle { right: 108px; }
  #tutorial-toggle { right: 156px; }
  #tutorial-canvas {
    position: fixed;
    inset: 0;
    z-index: 15;
    display: none;
    pointer-events: none;
  }
  #tutorial-panel {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 21;
    width: calc(100% - 48px);
    max-width: 480px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.72);
    color: white;
    padding: 16px 20px;
    border-radius: 10px;
    display: none;
  }
  #tutorial-panel.open {
    display: block;
  }
  #tutorial-step-label {
    margin: 0 0 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #9fd6ff;
  }
  #tutorial-title {
    margin: 0 0 6px;
    font-size: 16px;
  }
  #tutorial-body {
    margin: 0 0 14px;
    font-size: 13.5px;
    line-height: 1.5;
    color: #dde6ee;
  }
  #tutorial-controls {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  #tutorial-panel button {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: white;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #tutorial-panel button:hover {
    background: rgba(255, 255, 255, 0.28);
  }
  #tutorial-panel button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  #tutorial-panel #tutorial-close {
    position: absolute;
    top: 8px;
    right: 10px;
    background: none;
    border: none;
    color: #cfe1ee;
    padding: 2px 6px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  #tutorial-close:hover {
    color: white;
  }
  #settings-panel {
    position: fixed;
    top: 60px;
    right: 12px;
    z-index: 20;
    background: rgba(0, 0, 0, 0.55);
    color: white;
    padding: 14px 18px 18px;
    border-radius: 8px;
    min-width: 220px;
    display: none;
  }
  #settings-panel.open {
    display: block;
  }
  #settings-panel label {
    display: block;
    margin-top: 14px;
    font-size: 13px;
  }
  #settings-panel label:first-child {
    margin-top: 0;
  }
  #settings-panel input[type=range] {
    width: 100%;
    margin-top: 4px;
  }
  #randomise-button {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    font-size: 13px;
    cursor: pointer;
  }
  #randomise-button:hover {
    background: rgba(255, 255, 255, 0.28);
  }
  canvas { display: block; }
  /* overlay rather than canvas text, so it is not redrawn every frame */
  #stats {
    position: fixed;
    right: 8px;
    bottom: 8px;
    font: 14px Georgia, serif;
    color: #000;
    pointer-events: none;
  }
  </style>
  <link rel="shortcut icon" href="favicon.ico" />
</head>
<body>
  <canvas id="canvas"></canvas>
  <canvas id="tutorial-canvas"></canvas>
  <div id="stats"></div>

  <button id="play-toggle" class="icon-button" title="Pause/play (space)">&#10074;&#10074;</button>
  <button id="fullscreen-toggle" class="icon-button" title="Toggle fullscreen (F11)">&#9974;</button>
  <button id="settings-toggle" class="icon-button" title="Settings">&#9776;</button>
  <button id="tutorial-toggle" class="icon-button" title="How the caustics are made">?</button>

  <div id="settings-panel">
    <label>Brightness
      <input id="brightness-slider" type="range" min="0.05" max="0.6" step="0.01" value="0.3">
    </label>
    <label>Wave speed
      <input id="speed-slider" type="range" min="0" max="0.006" step="0.0002" value="0.002">
    </label>
    <label>Wave height
      <input id="amplitude-slider" type="range" min="0" max="0.25" step="0.005" value="0.1">
    </label>
    <label>Detail
      <input id="quality-slider" type="range" min="0.5" max="2.5" step="0.05" value="1">
    </label>
    <label>Wavelengths
      <input id="wavelengths-slider" type="range" min="1" max="14" step="1" value="9">
    </label>
    <button id="randomise-button" title="Shift every slider to a random value">&#127922; Randomise</button>
  </div>

  <div id="tutorial-panel">
    <button id="tutorial-close" title="Exit tutorial">&times;</button>
    <p id="tutorial-step-label"></p>
    <h3 id="tutorial-title"></h3>
    <p id="tutorial-body"></p>
    <div id="tutorial-controls">
      <button id="tutorial-back">Back</button>
      <button id="tutorial-next">Next</button>
    </div>
  </div>

  <script type="module" src="../src/app.js"></script>
</body>
</html>
